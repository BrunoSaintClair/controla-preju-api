# Security
api.security.token.secret-key=${JWT_SECRET}
api.token.jwt.issuer=controlaprejuapi
api.security.token.expiration-hours=168
api.security.refresh-token.expiration-hours=720

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/controlapreju_dev
spring.datasource.username=${DB_USERNAME:controlaprejuizodev}
spring.datasource.password=${DB_PASSWORD:controlaprejuizodev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Business Rule
api.max-accounts-per-user=7

# Email
api.email.from=noreply@gmail.com
api.confirm.email.route=http://localhost:8080/api/v1/auth/confirm?token=
api.reject.email.route=http://localhost:8080/api/v1/auth/reject?token=
api.frontend.url=https://www.controlapreju.com.br
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.stmp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

